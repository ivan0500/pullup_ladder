<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg:#14161A; --surface:#1B1E23; --surface2:#22262C; --hairline:#2C3036;
    --chalk:#EDEAE2; --muted:#8B9096; --brass:#D4A017; --brass-soft:#8A6B1E;
    --brass-glow:rgba(212,160,23,0.18); --rust:#A8412F; --moss:#7C9473;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--chalk);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0}
  button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .wrap{max-width:480px;margin:0 auto;padding:32px 20px 64px}
  .display{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.5px}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .eyebrow.brass{color:var(--brass)}
  h1{font-family:'Bebas Neue',Impact,sans-serif;font-size:40px;letter-spacing:1px;line-height:1;margin:4px 0 24px}
  .card{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;padding:20px;margin-bottom:24px}
  .inner{background:var(--surface2);border:1px solid var(--hairline);border-radius:12px;padding:12px 16px}
  .row{display:flex;align-items:center;justify-content:space-between}
  .btn-primary{width:100%;padding:14px;border-radius:12px;background:var(--brass);color:var(--bg);
    font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
  .btn-link{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--brass)}
  .btn-link.muted{color:var(--muted)}
  .step{width:28px;height:28px;border-radius:50%;background:var(--hairline);color:var(--chalk);
    font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
  .step.big{width:48px;height:48px;font-size:24px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--hairline)}
  .seg{flex:1;height:6px;border-radius:3px;background:var(--hairline)}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .xs{font-size:11px}
  .center{text-align:center}
  .stack{display:flex;flex-direction:column;gap:8px}
  .focus{min-height:100vh;display:flex;flex-direction:column}
  .focus .wrap{flex:1;display:flex;flex-direction:column;width:100%}
  .mid{flex:1;display:flex;flex-direction:column;justify-content:center}
  .pill{font-size:11px;padding:4px 8px;border-radius:999px}
  input[type=number]{background:var(--surface2);color:var(--chalk);border:1px solid var(--hairline);
    border-radius:8px;padding:4px 8px;width:64px;font-family:'Bebas Neue',Impact,sans-serif;font-size:24px}
  @media (prefers-reduced-motion:no-preference){
    .anim{transition:height .6s ease,bottom .6s ease}
    .ring{transition:stroke-dashoffset 1s linear}
  }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
(function(){
"use strict";

var GOAL = 20;
var KEY = "pullup-ladder-v1";

function defaultState(){
  return {
    currentMax:11, weekNumber:1, workoutsThisWeek:0, weekHits:[null,null,null],
    history:[], achieved:false, restSeconds:150, dailyTip:null,
    daysPerWeek:3, setsPerWorkout:4, testEveryWeeks:2, lastTestWeek:0
  };
}

var TIPS = [
  "Dead-hang every rep. Partial reps at the top inflate the number but won't carry over to a true 20 unbroken.",
  "Shoulders packed down and back before you pull, not shrugged up at your ears — that keeps the load on your lats instead of your neck.",
  "If your grip gives out before your back does, that's a grip problem, not a pulling-strength problem. A couple of dead-hang sets on off days fixes it.",
  "Recovery is where the adaptation happens, not the workout itself. If a session leaves you unable to hit your first-set target two days later, you're under-resting.",
  "Keep it strict. Kipping to hit a number defeats the point of training toward unbroken reps.",
  "Your last set will always feel worse than your first. That's fatigue, not regression — judge progress over weeks, not within a session.",
  "Retract your shoulder blades before you initiate the pull. It recruits your lats earlier and takes strain off your elbows.",
  "Stalled at the same max for 3-4 weeks? That's usually a volume problem, not a strength problem.",
  "Sleep and protein move the needle on pulling strength more than any cue does. This is a CNS-heavy lift.",
  "Controlled negatives — a slow 5-second lower — build strength right in the usual sticking point.",
  "Don't test your true max more than once every couple weeks. Testing too often just adds fatigue.",
  "If your hands give out before your back, chalk or a thicker grip can buy you real reps."
];

var NOTES = {
  bump:["Clean week. Every session, every target — the baseline moves up because you earned it.",
        "All the way through this week. That's exactly how this is supposed to go."],
  hit:["Targets hit. One more like this and the week counts.",
       "Clean across the board. Keep this pace and the bump is basically locked in."],
  miss:["Missed one — that's what the live adjustment is for. Show up for the next one.",
        "Off day. Log it honest and move on; one miss doesn't undo the week."],
  testUp:["New max, fresh and rested — that's a real number, not a fatigued guess.",
          "That's your new ceiling. Everything recalculates from here."],
  testFlat:["Didn't beat it this time — still useful data. Not every test is a PR.",
            "No new max today. Rest up, the next one might hit different."]
};

function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmt(s){ var m=Math.floor(s/60), x=s%60; return m+":"+(x<10?"0":"")+x; }

/* ---------- persistence ---------- */
var state = defaultState();
var storageOK = true;

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var p = JSON.parse(raw);
      var d = defaultState();
      for(var k in d){ if(!(k in p)) p[k]=d[k]; }
      state = p;
    }
  }catch(e){ storageOK=false; }
  if(!Array.isArray(state.weekHits) || state.weekHits.length!==state.daysPerWeek){
    state.weekHits = new Array(state.daysPerWeek).fill(null);
    if(state.workoutsThisWeek>=state.daysPerWeek) state.workoutsThisWeek=0;
  }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ storageOK=false; }
}

/* ---------- session (not persisted) ---------- */
var ui = {
  phase:"ready", setIndex:0, inputs:[], liveTargets:[], actuals:[],
  rest:0, feedback:null, completeType:"workout", testReps:11,
  showSettings:false, showHistory:false, editingMax:false, timer:null
};

/* ---------- plan math ---------- */
function computeTargets(max, n){
  var start=0.78, end=0.55, out=[];
  for(var i=0;i<n;i++){
    var pct = n===1 ? start : start-(start-end)*(i/(n-1));
    out.push(Math.max(3, Math.round(max*pct)));
  }
  return out;
}
function paceRatio(actuals, planned){
  if(!actuals.length) return 1;
  var s=0;
  for(var i=0;i<actuals.length;i++) s += actuals[i]/planned[i];
  return Math.min(1.3, Math.max(0.5, s/actuals.length));
}
function recalc(planned, actuals){
  var r = paceRatio(actuals, planned);
  return planned.map(function(t,i){
    return i<actuals.length ? actuals[i] : Math.max(2, Math.round(t*r));
  });
}
function targets(){ return computeTargets(state.currentMax, state.setsPerWorkout); }

/* ---------- rendering ---------- */
var app = document.getElementById("app");

function render(){
  stopTimer();
  if(ui.phase==="set") app.innerHTML = viewSet();
  else if(ui.phase==="resting"){ app.innerHTML = viewRest(); startTimer(); }
  else if(ui.phase==="test") app.innerHTML = viewTest();
  else if(ui.phase==="complete") app.innerHTML = viewComplete();
  else app.innerHTML = viewDashboard();
  window.scrollTo(0,0);
}

function ladder(){
  var pct = Math.min(100, state.currentMax/GOAL*100);
  var rungs="";
  for(var r=1;r<=GOAL;r++){
    rungs += '<div style="position:absolute;left:0;right:0;bottom:'+(r/GOAL*100)+'%;height:2px;background:'+
      (r<=state.currentMax ? "rgba(20,22,26,.35)" : "var(--hairline)")+'"></div>';
  }
  var marks="";
  [GOAL,15,10,5,1].forEach(function(m){
    marks += '<div class="xs" style="position:absolute;left:0;bottom:calc('+(m/GOAL*100)+'% - 7px);color:'+
      (m<=state.currentMax?"var(--brass)":"var(--muted)")+'">'+(m===GOAL?"GOAL · 20":m)+'</div>';
  });
  return '<div style="display:flex;gap:12px;height:260px">'+
    '<div style="position:relative;width:40px;border-radius:999px;overflow:hidden;background:var(--surface2);border:1px solid var(--hairline)">'+
      '<div class="anim" style="position:absolute;bottom:0;left:0;right:0;height:'+pct+'%;border-radius:999px;background:linear-gradient(180deg,var(--brass),var(--brass-soft))"></div>'+
      rungs+
      '<div class="anim" style="position:absolute;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;bottom:calc('+pct+'% - 6px);background:var(--chalk);box-shadow:0 0 0 4px var(--brass-glow)"></div>'+
    '</div><div style="position:relative;flex:1">'+marks+'</div></div>';
}

function viewDashboard(){
  var t = targets(), i = state.workoutsThisWeek;
  var since = state.weekNumber - state.lastTestWeek;
  var testDue = state.testEveryWeeks>0 && since>=state.testEveryWeeks && !state.achieved;
  var h="";

  h += '<div class="wrap">';
  h += '<div class="eyebrow brass">'+(state.achieved?"goal reached":"week "+state.weekNumber+" · day "+Math.min(i+1,state.daysPerWeek)+" of "+state.daysPerWeek)+'</div>';
  h += '<h1>PULL-UP LADDER</h1>';

  if(!storageOK){
    h += '<div class="card" style="border-color:var(--rust)"><div class="small">This browser is blocking local storage, so progress won\'t save between visits. Private browsing usually causes this — try a normal window.</div></div>';
  }

  if(state.achieved){
    h += '<div class="card" style="background:var(--brass-glow);border-color:var(--brass)"><div class="small">20 unbroken. That\'s the whole climb. Keep training to stay sharp, or reset to chase a new number.</div></div>';
  }

  if(testDue){
    h += '<button onclick="A.startTest()" class="card" style="display:block;width:100%;text-align:left;background:var(--brass-glow);border-color:var(--brass)">'+
      '<span class="small" style="color:var(--brass);font-weight:700">AMRAP re-test due</span>'+
      '<span class="small"> — '+since+' week'+(since===1?"":"s")+' since your last one. Run a fresh test to recalibrate →</span></button>';
  }

  /* max + ladder */
  h += '<div class="card"><div class="row" style="align-items:flex-end;margin-bottom:16px"><div>'+
    '<div class="eyebrow" style="margin-bottom:4px">current max</div>';
  if(ui.editingMax){
    h += '<div style="display:flex;align-items:center;gap:8px">'+
      '<input type="number" id="maxInput" value="'+state.currentMax+'">'+
      '<button onclick="A.saveMax()" class="xs" style="padding:4px 10px;border-radius:8px;background:var(--brass);color:var(--bg)">save</button></div>';
  }else{
    h += '<button onclick="A.editMax()" style="display:flex;align-items:baseline;gap:4px">'+
      '<span class="display" style="font-size:56px;line-height:1;color:var(--brass)">'+state.currentMax+'</span>'+
      '<span class="muted" style="font-size:18px">/ '+GOAL+'</span></button>';
  }
  h += '</div><div class="xs muted">'+(GOAL-state.currentMax>0 ? (GOAL-state.currentMax)+" reps to go" : "goal reached")+'</div></div>';
  h += ladder()+'</div>';

  /* today */
  if(!state.achieved){
    h += '<div class="card">';
    h += '<div class="row" style="margin-bottom:4px"><div class="eyebrow">today</div><div style="display:flex;gap:6px">';
    for(var d=0; d<state.daysPerWeek; d++){
      var bg = d<i ? (state.weekHits[d]?"var(--moss)":"var(--rust)") : (d===i?"var(--brass)":"var(--hairline)");
      h += '<div class="dot" style="background:'+bg+'"></div>';
    }
    h += '</div></div>';
    h += '<div class="display" style="font-size:28px;margin-bottom:16px">Day '+(i+1)+' of '+state.daysPerWeek+'</div>';

    if(ui.showSettings){
      h += '<div class="stack" style="margin-bottom:16px">';
      h += setting("workouts / week", state.daysPerWeek, "daysPerWeek", 2, 6);
      h += setting("sets / workout", state.setsPerWorkout, "setsPerWorkout", 3, 6);
      h += setting("AMRAP re-test every", state.testEveryWeeks===0?"off":state.testEveryWeeks+"w", "testEveryWeeks", 0, 4);
      h += setting("rest between sets", fmt(state.restSeconds), "restSeconds", 30, 300, 15);
      h += '<div class="xs muted">Changing workouts/week resets this week\'s dots. Everything else carries over.</div>';
      h += '</div>';
    }

    h += '<div class="inner" style="margin-bottom:16px">';
    for(var s=0;s<t.length;s++){
      h += '<div class="row small"><span class="muted">Set '+(s+1)+'</span><span>'+t[s]+' reps</span></div>';
    }
    h += '</div>';

    h += '<button onclick="A.startWorkout()" class="btn-primary" style="margin-bottom:12px">Start Workout</button>';
    h += '<div class="row"><button onclick="A.startTest()" class="btn-link">run amrap test →</button>'+
         '<button onclick="A.toggleSettings()" class="btn-link muted">'+(ui.showSettings?"hide plan settings":"edit plan")+'</button></div>';
    h += '</div>';
  }

  /* coach */
  h += '<div class="card"><div class="eyebrow" style="margin-bottom:8px">coach\'s corner</div>';
  if(state.dailyTip && state.dailyTip.date===new Date().toDateString()){
    h += '<div class="small" style="margin-bottom:8px">'+esc(state.dailyTip.text)+'</div>'+
         '<button onclick="A.newTip()" class="btn-link">different tip →</button>';
  }else{
    h += '<button onclick="A.newTip()" class="small" style="color:var(--brass)">Get today\'s coaching tip →</button>';
  }
  h += '</div>';

  /* explainer */
  h += '<div class="card"><div class="eyebrow" style="color:var(--chalk);margin-bottom:8px">how this progresses</div>'+
    '<div class="small muted" style="line-height:1.6">Every set is submaximal — a descending ladder from about 78% down to 55% of your max. No set asks you to max out fatigued. If a set comes in high or low, the rest of that day adjusts to your pace, but weekly bumps are graded against the original plan. Real recalibration comes from AMRAP tests: fresh, rested, on their own.</div></div>';

  /* history */
  h += '<button onclick="A.toggleHistory()" class="eyebrow" style="display:block;margin-bottom:12px">'+
    (ui.showHistory?"hide":"show")+' history ('+state.history.length+')</button>';
  if(ui.showHistory){
    if(!state.history.length){
      h += '<div class="small muted" style="margin-bottom:24px">Nothing logged yet.</div>';
    }else{
      h += '<div class="stack" style="margin-bottom:24px">';
      state.history.forEach(function(e){
        var good = e.type==="test" ? e.isNewMax : e.hitAll;
        var label = e.type==="test" ? (e.isNewMax?"new max":"logged") : (e.hitAll?"hit":"missed");
        h += '<div class="inner row">'+
          '<div><div class="small">'+(e.type==="test" ? "Week "+e.week+" · AMRAP Test" : "Week "+e.week+" · Day "+e.workoutNum)+'</div>'+
          '<div class="xs muted">'+(e.type==="test" ? e.reps+" reps" : e.sets.join(" / "))+'</div></div>'+
          '<div class="pill" style="background:'+(good?"rgba(124,148,115,.15)":"rgba(168,65,47,.15)")+';color:'+(good?"var(--moss)":"var(--rust)")+'">'+label+'</div></div>';
      });
      h += '</div>';
    }
  }

  /* data */
  h += '<div class="card" style="margin-bottom:0"><div class="eyebrow" style="margin-bottom:4px">your data</div>'+
    '<div class="xs muted" style="margin-bottom:12px">Everything saves on this device automatically. Exports are for backup or moving to another phone.</div>'+
    '<div class="stack" style="align-items:flex-start">'+
    '<button onclick="A.exportCSV()" class="small">Export history as CSV →</button>'+
    '<button onclick="A.exportJSON()" class="small">Export full backup as JSON →</button>'+
    '<button onclick="A.importJSON()" class="small">Restore from JSON backup →</button>'+
    '<button onclick="A.reset()" class="small" style="color:var(--rust);margin-top:8px">Reset all progress</button>'+
    '</div></div>';

  h += '</div>';
  return h;
}

function setting(label, val, key, min, max, step){
  return '<div class="inner row">'+
    '<span class="small muted">'+label+'</span>'+
    '<div style="display:flex;align-items:center;gap:12px">'+
      '<button class="step" onclick="A.setPlan(\''+key+'\',-1,'+min+','+max+','+(step||1)+')">–</button>'+
      '<span class="display" style="font-size:18px;min-width:44px;text-align:center">'+val+'</span>'+
      '<button class="step" onclick="A.setPlan(\''+key+'\',1,'+min+','+max+','+(step||1)+')">+</button>'+
    '</div></div>';
}

function focusHeader(label, showCancel){
  return '<div class="row" style="margin-bottom:32px">'+
    '<div class="eyebrow brass">'+label+'</div>'+
    (showCancel?'<button onclick="A.cancel()" class="xs muted">cancel</button>':'')+'</div>';
}

function segments(active, total, allDone){
  var h='<div style="display:flex;gap:8px;margin-bottom:32px">';
  for(var i=0;i<total;i++){
    var bg = (i<active||allDone) ? "var(--brass)" : (i===active ? "var(--chalk)" : "var(--hairline)");
    h += '<div class="seg" style="background:'+bg+'"></div>';
  }
  return h+'</div>';
}

function counter(value, decFn, incFn){
  return '<div class="card" style="margin-bottom:32px">'+
    '<div style="display:flex;flex-direction:column;align-items:center;gap:16px">'+
      '<span class="eyebrow">reps completed</span>'+
      '<div style="display:flex;align-items:center;gap:24px">'+
        '<button class="step big" onclick="'+decFn+'">–</button>'+
        '<span class="display" style="font-size:72px;color:var(--brass);min-width:90px;text-align:center">'+value+'</span>'+
        '<button class="step big" onclick="'+incFn+'">+</button>'+
      '</div></div></div>';
}

function viewSet(){
  var t = targets(), i = ui.setIndex, n = state.setsPerWorkout;
  var h = '<div class="focus"><div class="wrap">';
  h += focusHeader("week "+state.weekNumber+" · day "+(state.workoutsThisWeek+1)+" of "+state.daysPerWeek, true);
  h += segments(i, n, false);
  h += '<div class="mid">';
  h += '<div class="eyebrow center">set '+(i+1)+' of '+n+(i===n-1?" · final set":"")+'</div>';
  h += '<div class="display center" style="font-size:22px;margin:8px 0">target: '+ui.liveTargets[i]+' reps</div>';
  if(i>0 && ui.liveTargets[i]!==t[i]){
    var up = ui.liveTargets[i]>t[i];
    h += '<div class="xs center" style="color:'+(up?"var(--moss)":"var(--rust)")+';margin-bottom:24px">'+
      (up?"adjusted up":"adjusted down")+' from '+t[i]+' — pacing at '+Math.round(paceRatio(ui.actuals,t)*100)+'% today</div>';
  }else{
    h += '<div style="margin-bottom:24px"></div>';
  }
  h += counter(ui.inputs[i], "A.bump(-1)", "A.bump(1)");
  h += '<button onclick="A.logSet()" class="btn-primary">'+(i<n-1?"Log Set &amp; Rest":"Log Set &amp; Finish")+'</button>';
  h += '</div></div></div>';
  return h;
}

function viewRest(){
  var i = ui.setIndex;
  var C = 2*Math.PI*98;
  var off = C*(1 - ui.rest/Math.max(1,state.restSeconds));
  var h = '<div class="focus"><div class="wrap">';
  h += focusHeader("week "+state.weekNumber+" · day "+(state.workoutsThisWeek+1)+" of "+state.daysPerWeek, true);
  h += segments(i+1, state.setsPerWorkout, false);
  h += '<div class="mid" style="align-items:center">';
  h += '<div class="eyebrow" style="margin-bottom:12px">resting</div>';
  h += '<div style="position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center;margin-bottom:32px">'+
    '<svg width="220" height="220" style="position:absolute;transform:rotate(-90deg)">'+
      '<circle cx="110" cy="110" r="98" fill="none" stroke="var(--hairline)" stroke-width="10"></circle>'+
      '<circle id="ring" class="ring" cx="110" cy="110" r="98" fill="none" stroke="var(--brass)" stroke-width="10" '+
        'stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'"></circle>'+
    '</svg>'+
    '<span id="clock" class="display" style="font-size:56px">'+fmt(ui.rest)+'</span></div>';
  h += '<div style="display:flex;gap:12px;margin-bottom:24px">'+
    '<button onclick="A.nudge(-15)" class="inner small">–15s</button>'+
    '<button onclick="A.nudge(15)" class="inner small">+15s</button></div>';
  h += '<div class="small muted center" style="margin-bottom:24px">up next — set '+(i+2)+' · target '+ui.liveTargets[i+1]+'</div>';
  h += '<button onclick="A.skipRest()" class="btn-link">skip rest →</button>';
  h += '</div></div></div>';
  return h;
}

function viewTest(){
  var h = '<div class="focus"><div class="wrap">';
  h += focusHeader("amrap max test", true);
  h += '<div class="mid">';
  h += '<div class="eyebrow center">fresh · rested · all-out</div>';
  h += '<div class="display center" style="font-size:20px;margin:8px 0 32px">One set, no fatigue going in. See what you\'ve actually got.</div>';
  h += counter(ui.testReps, "A.bumpTest(-1)", "A.bumpTest(1)");
  h += '<button onclick="A.logTest()" class="btn-primary">Log AMRAP Test</button>';
  h += '</div></div></div>';
  return h;
}

function viewComplete(){
  var f = ui.feedback, isTest = ui.completeType==="test";
  var good = isTest ? f.isNewMax : f.hitAll;
  var h = '<div class="focus"><div class="wrap">';
  h += focusHeader(isTest?"amrap max test":"week "+state.weekNumber, false);
  h += '<div class="mid">';
  h += '<div class="display center" style="font-size:44px;margin-bottom:24px">'+(isTest?"test logged":"day logged")+'</div>';

  h += '<div class="card" style="border-color:'+(good?"var(--moss)":"var(--rust)")+';margin-bottom:16px">';
  if(isTest){
    h += f.isNewMax
      ? '<div class="small">New max: <b style="color:var(--brass)">'+f.newMax+'</b> — the plan just recalculated around this.</div>'
      : '<div class="small">'+f.reps+' reps — max holds at '+f.newMax+'. Good data either way.</div>';
  }else{
    if(f.bump) h += '<div class="small">Clean week. Max bumped to <b style="color:var(--brass)">'+f.newMax+'</b>.</div>';
    else if(!f.hitAll) h += '<div class="small">Missed a target — log it honest, hit the next one. Max holds at '+f.newMax+'.</div>';
    else h += '<div class="small">Targets hit. Keep stacking clean days this week.</div>';
  }
  if(f.achieved) h += '<div class="small" style="color:var(--brass);margin-top:8px">20 unbroken. That\'s the whole climb.</div>';
  h += '</div>';

  h += '<div class="card" style="background:var(--surface2);margin-bottom:24px">'+
    '<div class="eyebrow" style="margin-bottom:8px">coach\'s take</div>'+
    '<div class="small">'+esc(f.note)+'</div></div>';

  h += '<button onclick="A.done()" class="btn-primary">Back to Ladder</button>';
  h += '</div></div></div>';
  return h;
}

/* ---------- timer ---------- */
function startTimer(){
  stopTimer();
  ui.timer = setInterval(function(){
    ui.rest--;
    if(ui.rest<=0){ stopTimer(); A.goToSet(ui.setIndex+1); return; }
    var c=document.getElementById("clock"), r=document.getElementById("ring");
    if(c) c.textContent = fmt(ui.rest);
    if(r){
      var C=2*Math.PI*98;
      r.setAttribute("stroke-dashoffset", C*(1-ui.rest/Math.max(1,state.restSeconds)));
    }
  },1000);
}
function stopTimer(){ if(ui.timer){ clearInterval(ui.timer); ui.timer=null; } }

/* ---------- actions ---------- */
var A = {
  goToSet:function(i){
    var t = targets();
    ui.inputs[i] = (i<ui.liveTargets.length ? ui.liveTargets[i] : t[i]);
    ui.setIndex = i;
    ui.phase = "set";
    render();
  },
  startWorkout:function(){
    var t = targets();
    ui.feedback=null; ui.actuals=[]; ui.liveTargets=t.slice(); ui.inputs=t.slice();
    ui.setIndex=0; ui.completeType="workout"; ui.phase="set";
    render();
  },
  bump:function(d){
    ui.inputs[ui.setIndex] = Math.max(0, Math.min(40, ui.inputs[ui.setIndex]+d));
    var el = document.querySelector(".mid .display[style*='72px']");
    if(el) el.textContent = ui.inputs[ui.setIndex]; else render();
  },
  bumpTest:function(d){
    ui.testReps = Math.max(0, Math.min(40, ui.testReps+d));
    var el = document.querySelector(".mid .display[style*='72px']");
    if(el) el.textContent = ui.testReps; else render();
  },
  logSet:function(){
    var t = targets(), n = state.setsPerWorkout;
    ui.actuals.push(ui.inputs[ui.setIndex]);
    if(ui.setIndex < n-1){
      ui.liveTargets = recalc(t, ui.actuals);
      ui.rest = state.restSeconds;
      ui.phase = "resting";
      render();
    }else{
      A.finish();
    }
  },
  nudge:function(d){
    ui.rest = Math.max(1, ui.rest+d);
    var c=document.getElementById("clock"); if(c) c.textContent=fmt(ui.rest);
  },
  skipRest:function(){ stopTimer(); A.goToSet(ui.setIndex+1); },
  cancel:function(){ stopTimer(); ui.phase="ready"; render(); },

  finish:function(){
    var t = targets(), n = state.setsPerWorkout;
    var actuals = ui.inputs.slice(0,n);
    var hitAll = actuals.every(function(a,i){ return a>=t[i]; });
    var i = state.workoutsThisWeek;

    var hits = state.weekHits.slice();
    hits[i] = hitAll;

    var week = state.weekNumber, count = i+1, bump=false, max=state.currentMax;
    if(count >= state.daysPerWeek){
      if(hits.every(function(x){ return x===true; })){ max++; bump=true; }
      count = 0; week++;
      hits = new Array(state.daysPerWeek).fill(null);
    }
    max = Math.min(max, GOAL);
    var achieved = max>=GOAL;

    state.history.unshift({
      type:"workout", date:new Date().toISOString(), week:state.weekNumber,
      workoutNum:i+1, sets:actuals, targets:t, hitAll:hitAll, maxAfter:max
    });
    state.history = state.history.slice(0,200);
    state.currentMax=max; state.weekNumber=week; state.workoutsThisWeek=count;
    state.weekHits=hits; state.achieved=achieved;
    save();

    ui.feedback = { hitAll:hitAll, bump:bump, achieved:achieved, newMax:max,
      note: bump ? pick(NOTES.bump) : (!hitAll ? pick(NOTES.miss) : pick(NOTES.hit)) };
    ui.completeType="workout"; ui.phase="complete";
    render();
  },

  startTest:function(){
    ui.feedback=null; ui.testReps=state.currentMax; ui.completeType="test"; ui.phase="test";
    render();
  },
  logTest:function(){
    var reps = ui.testReps;
    var isNew = reps > state.currentMax;
    var max = Math.min(GOAL, Math.max(state.currentMax, reps));
    state.history.unshift({ type:"test", date:new Date().toISOString(), week:state.weekNumber,
      reps:reps, isNewMax:isNew, maxAfter:max });
    state.history = state.history.slice(0,200);
    state.currentMax=max; state.lastTestWeek=state.weekNumber; state.achieved=max>=GOAL;
    save();
    ui.feedback = { isNewMax:isNew, newMax:max, reps:reps, achieved:state.achieved,
      note: isNew ? pick(NOTES.testUp) : pick(NOTES.testFlat) };
    ui.completeType="test"; ui.phase="complete";
    render();
  },
  done:function(){ ui.phase="ready"; render(); },

  toggleSettings:function(){ ui.showSettings=!ui.showSettings; render(); },
  toggleHistory:function(){ ui.showHistory=!ui.showHistory; render(); },
  editMax:function(){ ui.editingMax=true; render(); },
  saveMax:function(){
    var v = parseInt(document.getElementById("maxInput").value,10);
    if(!isNaN(v)) state.currentMax = Math.max(1, Math.min(GOAL, v));
    state.achieved = state.currentMax>=GOAL;
    ui.editingMax=false; save(); render();
  },
  setPlan:function(key, dir, min, max, step){
    var v = state[key] + dir*step;
    v = Math.max(min, Math.min(max, v));
    state[key] = v;
    if(key==="daysPerWeek"){
      state.weekHits = new Array(v).fill(null);
      state.workoutsThisWeek = 0;
    }
    save(); render();
  },
  newTip:function(){
    state.dailyTip = { date:new Date().toDateString(), text:pick(TIPS) };
    save(); render();
  },

  exportCSV:function(){
    var rows = [["date","type","week","day","sets","targets","hit_all","test_reps","max_after"].join(",")];
    state.history.forEach(function(e){
      rows.push(e.type==="test"
        ? [e.date,"test",e.week,"","","","",e.reps,e.maxAfter].join(",")
        : [e.date,"workout",e.week,e.workoutNum,'"'+e.sets.join("/")+'"','"'+e.targets.join("/")+'"',e.hitAll,"",e.maxAfter].join(","));
    });
    dl("pullup-history.csv", rows.join("\n"), "text/csv");
  },
  exportJSON:function(){ dl("pullup-backup.json", JSON.stringify(state,null,2), "application/json"); },
  importJSON:function(){ document.getElementById("importFile").click(); },
  reset:function(){
    if(confirm("Reset all progress? This clears your history and takes you back to a max of 11. Export a backup first if you want to keep it.")){
      state = defaultState(); save(); ui.phase="ready"; render();
    }
  }
};
window.A = A;

function dl(name, content, mime){
  var b = new Blob([content],{type:mime}), u = URL.createObjectURL(b);
  var a = document.createElement("a"); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(u);
}

document.getElementById("importFile").addEventListener("change", function(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(ev){
    try{
      var p = JSON.parse(ev.target.result), d = defaultState();
      for(var k in d){ if(!(k in p)) p[k]=d[k]; }
      state = p; save(); render();
      alert("Backup restored.");
    }catch(err){ alert("Couldn't read that file — make sure it's a JSON backup from this app."); }
  };
  r.readAsText(f);
  e.target.value = "";
});

load();
render();

})();
</script>
</body>
</html>
